[pytest]
# ============================================================
# Configuration pytest — Projet 05 : Agrégateur météo
# ============================================================
# pytest-asyncio : mode "auto" pour détecter automatiquement
#   les tests async (fonctions async def) sans @pytest.mark.asyncio
# asyncio_mode = auto
#
# Couverture de code (pytest-cov) :
#   Lancé avec : pytest --cov=app --cov-report=term-missing
#   Objectif : ≥ 70% (exigence du sujet)
# ============================================================

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --tb=short
    -v
