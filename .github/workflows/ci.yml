name: CI — MiabeMETEO

# ─────────────────────────────────────────────────────────────────────────────
# Déclencheurs
#   • Toutes les branches → lint + tests + build Docker
#   • PR vers main / develop / kaled → idem
#   • Le déploiement est géré par Railway (intégration GitHub native)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - kaled
      - ameliorations
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
      - kaled
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/meteo-app

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer ruff
        run: pip install ruff==0.4.4

      - name: Vérifier les erreurs de style
        run: ruff check .

      - name: Vérifier le formatage
        run: ruff format --check .

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — Tests
  # ───────────────────────────────────────────────────────────────────────────
  tests:
    name: Tests (pytest + couverture ≥ 70 %)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v
        env:
          OPENWEATHER_API_KEY: "test_key"
          WEATHERAPI_KEY: "test_key"
          REDIS_URL: "redis://localhost:6379"

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 — Build Docker + smoke test
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer le tag de l'image
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Construire l'image Docker
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Smoke test — démarrer le conteneur
        run: |
          docker run --rm -d \
            --name meteo_smoke \
            -p 8000:8000 \
            -e OPENWEATHER_API_KEY=test_key \
            -e WEATHERAPI_KEY=test_key \
            -e REDIS_URL=redis://localhost:6379 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Smoke test — vérifier GET /sante
        run: |
          curl --retry 10 \
               --retry-delay 3 \
               --retry-connrefused \
               --retry-all-errors \
               --fail \
               --silent \
               --show-error \
               http://localhost:8000/sante

      - name: Smoke test — arrêter le conteneur
        if: always()
        run: docker stop meteo_smoke || true
