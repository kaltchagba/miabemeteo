name: CI

on:
  push:
    branches: [main, develop, kaled]
  pull_request:
    branches: [main, develop, kaled]

jobs:

  # ----------------------------------------------------------------
  # Job 1 : Vérification du style et détection d'erreurs statiques
  # ----------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer ruff
        run: pip install ruff==0.4.4

      - name: Vérifier le style du code
        run: ruff check .

  # ----------------------------------------------------------------
  # Job 2 : Tests automatisés avec mesure de couverture
  # ----------------------------------------------------------------
  tests:
    name: Tests (pytest + couverture)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v
        env:
          # Variables d'environnement fictives pour les tests
          # (aucun appel réel n'est fait : fakeredis + respx interceptent tout)
          OPENWEATHER_API_KEY: "test_key"
          WEATHERAPI_KEY: "test_key"
          REDIS_URL: "redis://localhost:6379"

  # ----------------------------------------------------------------
  # Job 3 : Construction de l'image Docker
  # ----------------------------------------------------------------
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t meteo-app:ci .
