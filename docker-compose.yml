# ============================================================
# docker-compose.yml — Orchestration des services du projet
# ============================================================
# Démarre l'application ET Redis avec une seule commande :
#     docker compose up
# ============================================================

# Version du format docker-compose (3.9 = recommandé pour les projets modernes)
version: "3.9"

services:

  # ---- Service 1 : l'application FastAPI ----
  app:
    # Construit l'image depuis le Dockerfile à la racine du projet
    build: .

    # Nom du conteneur (optionnel, mais utile pour les logs)
    container_name: meteo_app

    # Relit les variables depuis le fichier .env (non commité, secrets réels)
    env_file:
      - .env

    # Ouvre le port 8000 du conteneur sur le port 8000 de la machine hôte
    # Format : "hote:conteneur"
    ports:
      - "8000:8000"

    # L'app ne démarre qu'une fois Redis sain (healthcheck vérifié)
    depends_on:
      redis:
        condition: service_healthy  # attend que Redis réponde

    # Redémarre automatiquement si le conteneur plante
    restart: unless-stopped

    # Vérifie que l'application répond bien après le démarrage
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/sante')"]
      interval: 30s   # vérifie toutes les 30 secondes
      timeout: 10s    # échec si pas de réponse en 10 secondes
      retries: 3      # 3 échecs consécutifs = conteneur "unhealthy"
      start_period: 15s  # laisse 15s à l'app pour démarrer avant le premier check

  # ---- Service 2 : Redis (cache) ----
  redis:
    # Image officielle Redis (version alpine = plus légère)
    image: redis:7-alpine

    container_name: meteo_redis

    # Redémarre automatiquement si le conteneur plante
    restart: unless-stopped

    # Persiste les données Redis sur le disque de la machine hôte.
    # Sans volume, toutes les données du cache sont perdues si Redis redémarre.
    volumes:
      - redis_data:/data

    # Commande Redis avec sauvegarde sur disque toutes les 60s si 1 clé a changé
    command: redis-server --save 60 1 --loglevel warning

    # Vérifie que Redis répond avant que l'app ne démarre
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # redis-cli ping doit répondre "PONG"
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Service 3 : Prometheus (collecte des métriques) ----
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: meteo_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # ---- Service 4 : Grafana (visualisation des métriques) ----
  grafana:
    image: grafana/grafana:10.4.2
    container_name: meteo_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-meteo2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ENABLE_GZIP=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# ---- Volumes persistants ----
volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local